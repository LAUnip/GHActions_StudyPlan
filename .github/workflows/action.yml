name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0/30 * * * *'
  

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Show triggering event
        run: echo "Triggered by ${{ github.event_name }} event"
        
      - uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 24
